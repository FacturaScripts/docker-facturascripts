services:

  mysql:
    image: mysql:8.2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  facturascripts:
    image: facturascripts/facturascripts:latest
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 80:80
    volumes:
      - ./facturascripts:/var/www/html

  adminer:
    image: adminer
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
